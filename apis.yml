name: OVIA
description: >-
  OVIA is listed via wepow.com, the domain of Wepow, a video-interviewing and
  candidate-assessment startup backed by 500 Global. Wepow is now part of Harver,
  a Talent Intelligence platform offering pre-employment assessments, automated
  interview scheduling, video interviewing, game-based assessments (pymetrics),
  and reference checking (Checkster). wepow.com 301-redirects to harver.com, and
  the served /.well-known documents and llms.txt are Harver's. This entry has no
  independent, self-service public API surface; enrichment captured the live
  security, well-known, and AI-governance signals published on the domain.
